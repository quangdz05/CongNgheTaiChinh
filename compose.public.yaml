services:
  api:
    build: { context: ., dockerfile: Back-end/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Proxy__ForwardLimit: 2
      Proxy__KnownNetworks__0: ${FRAUDSHIELD_SUBNET:-172.30.0.0/24}
      AllowedHosts: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      ConnectionStrings__FraudShield: Data Source=/app/data/fraudshield.db
      Ai__BaseUrl: http://ai:8001/
      Ai__ApiKey: ${AI_SERVICE_KEY:?Set AI_SERVICE_KEY in .env}
      Security__JwtSecret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Security__PiiSalt: ${PII_SALT:?Set PII_SALT in .env}
      Security__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Security__AnalystPassword: ${ANALYST_PASSWORD:?Set ANALYST_PASSWORD in .env}
    volumes:
      - database:/app/data
    depends_on:
      ai:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build: { context: ., dockerfile: ai-service/Dockerfile }
    environment:
      APP_ENV: production
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:?Set AI_SERVICE_KEY in .env}
    volumes:
      - models:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: Front-end/Dockerfile }
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  train:
    profiles: [training]
    build: { context: ., dockerfile: ai-service/Dockerfile }
    command: [python, train.py, --synthetic, --samples, "6000"]
    volumes:
      - models:/app/artifacts

volumes:
  database:
  models:
  caddy_data:
  caddy_config:

networks:
  default:
    ipam:
      config:
        - subnet: ${FRAUDSHIELD_SUBNET:-172.30.0.0/24}
