services:
  api:
    build: {context: ., dockerfile: Back-end/Dockerfile}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Proxy__ForwardLimit: 1
      Proxy__KnownNetworks__0: ${FRAUDSHIELD_SUBNET:-172.30.0.0/24}
      Ai__BaseUrl: http://ai:8001/
      Ai__ApiKey: local-ai-service-key
      AllowedHosts: localhost;127.0.0.1;api
    volumes: ["database:/app/data"]
  ai:
    build: {context: ., dockerfile: ai-service/Dockerfile}
    environment: {APP_ENV: development, AI_SERVICE_KEY: local-ai-service-key}
    volumes: ["models:/app/artifacts"]
  web:
    build: {context: ., dockerfile: Front-end/Dockerfile}
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
  train:
    profiles: [training]
    build: {context: ., dockerfile: ai-service/Dockerfile}
    command: [python, train.py, --synthetic, --samples, "6000"]
    volumes: ["models:/app/artifacts"]
volumes:
  database:
  models:
networks:
  default:
    ipam:
      config:
        - subnet: ${FRAUDSHIELD_SUBNET:-172.30.0.0/24}
